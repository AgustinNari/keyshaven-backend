<title id="svg-title">KeysHaven Backend Architecture</title><desc id="svg-desc">KeysHaven frontend communicates with a Java Spring Boot REST API secured by Spring Security and JWT, where controllers and business services manage catalog, sellers, orders, discounts and digital-key inventory stored in MySQL via JPA Hibernate.</desc>
