spring.application.name=marketplace
server.port=${SERVER_PORT:4002}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketplace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
application.security.jwt.secretKey=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
